spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable JPA/Hibernate as requested, using JdbcTemplate
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# Optional: Disable Hikari pool logs if they expose credentials (usually they don't, but good for cleanliness)
# logging.level.com.zaxxer.hikari=WARN
